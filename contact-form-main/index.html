<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Contact form</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="/assets/scss/main.css" />
  </head>
  <body
    class="container bg-success-subtle d-flex flex-column align-items-center justify-content-center p-3 py-4"
  >
    <main class="bg-white p-4 rounded-4">
      <h1 class="h1 fw-bold text-success-emphasis mb-4">Contact Us</h1>
      <form>
        <div class="row row-gap-3">
          <div class="col-12 col-md-6">
            <label for="fName" class="d-block mb-2">First Name <span class="text-success-emphasis">*</span></label>
            <input type="text" aria-describedby="req-msg" id="fName" class="d-block w-100 p-2 rounded-2" />
          </div>
          <div class="col-12 col-md-6">
            <label for="lName" class="d-block mb-2">Last Name <span class="text-success-emphasis">*</span></label>
            <input type="text" aria-describedby="req-msg" id="lName" class="d-block w-100 p-2 rounded-2" />
          </div>
          <div class="col-12">
            <label for="email" class="d-block mb-2">Email Address <span class="text-success-emphasis">*</span></label>
            <input
              type="email"
              aria-describedby="req-msg email-instructions"
              id="email"
              class="d-block w-100 p-2 rounded-2"
            />
            <p id="email-instructions" hidden>Please enter a valid email address</p>
          </div>
          <fieldset>
            <legend>Query Type <span class="text-success-emphasis">*</span></legend>
            <div class="row">
              <div class="col-12 col-md-6">
                <div class="border p-2 rounded-2 border-secondary">
                  <input
                    type="radio"
                    name="query-type"
                    value="general-enquiry"
                    aria-describedby="req-msg query-instructions"
                    id="general-enquiry"
                  />
                  <label for="general-enquiry">General Enquiry</label>
                  
                </div>
              </div>
              <div class="col-12 col-md-6">
                <div class="border p-2 rounded-2 border-secondary">
                  <input
                    type="radio"
                    name="query-type"
                    value="support-request"
                    aria-describedby="req-msg query-instructions"
                    id="support-request"
                  />
                  <label for="support-request">Support Request</label>
                  
                </div>
              </div>
            </div>
            <p id="query-instructions" hidden>Please select a query type</p>
          </fieldset>
          <div>
            <label for="message" class="d-block mb-2">Message <span class="text-success-emphasis">*</span></label>
            <textarea id="message" class="d-block w-100 p-2 rounded-2" rows="3"></textarea>
          </div>
        </div>

        <label for="consent" class="d-flex align-items-center gap-3 mt-4"
          ><input
            type="checkbox"
            id="consent"
            aria-describedby="req-msg consent-instruction"
          />
          I consent to being contacted by the team <span class="text-success-emphasis">*</span></label
        >

        <p id="consent-instruction" hidden>
          To submit this form, please consent to being contacted
        </p>
        <button type="submit" class="d-block w-100 text-white rounded-2 border-0 mt-4">Submit</button>
        <span id="req-msg" hidden>This field is required</span>
      </form>
    </main>

    <div class="toast" hidden>
      <h2>Message Sent!</h2>
      <p>Thanks for completing the form. We'll be in touch soon!</p>
    </div>

    <footer class="attribution">
      <p>
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >
      </p>
      <p>
        Coded by
        <a
          href="https://www.frontendmentor.io/profile/itsmesrishti"
          target="_blank"
          >Srishti Chaudhary</a
        >
      </p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
